mode = "human_visible_dagger"

[run]
dataset = "data/DMDOD-v140-tuf-p11-p20"
checkpoint = "checkpoints/real_chart_v191_fly4096_school8h.pt"
output = "checkpoints/real_chart_humanvisible_smoke.pt"
device = "cuda"

[data]
anchor_limit = 6
validation_limit = 1
chunk_steps = 96

[human_visible]
updates_per_trial = 2
lr = 0.00005
min_lr = 0.000001
weight_decay = 0.0001
grad_clip = 1.0
seed = 2401

[budget]
hours = 0.15
reserve_minutes = 0.5
max_trials = 6
reject_shrink = 0.5
safe_grow = 1.25
max_nonbest_accepts = 2
