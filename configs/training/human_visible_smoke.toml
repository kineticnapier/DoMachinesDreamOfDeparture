mode = "human_visible_curriculum_dagger"

[run]
dataset = "data/DMDOD-v140-tuf-p11-p20"
checkpoint = "checkpoints/real_chart_v191_fly4096_school8h.pt"
output = "checkpoints/real_chart_humanvisible_smoke.pt"
device = "cuda"

[data]
anchor_limit = 6
validation_limit = 3
chunk_steps = 96

[human_visible]
updates_per_trial = 2
lr = 0.00005
min_lr = 0.000001
controller_lr = 0.00003
updates_per_epoch = 8
transition_updates_per_epoch = 4
transition_epochs = 3
burn_in_steps = 64
supervised_steps = 96
anchors_per_batch = 4
progression_streak = 2
catastrophic_patience = 2
max_epochs = 3
weight_decay = 0.0001
grad_clip = 1.0
seed = 2401

[budget]
hours = 0.15
reserve_minutes = 0.5
max_trials = 6
reject_shrink = 0.5
safe_grow = 1.25
max_nonbest_accepts = 2
