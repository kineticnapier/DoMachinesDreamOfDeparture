# Controlled, independent beta DAgger training ablation.
# NO training through scripts/train_real_chart.py: use
# uv run python -u scripts/train_human_visible_beta_ablation.py
# run.output is required by the shared loader but is NEVER written.
mode = "human_visible_curriculum_dagger"

[run]
dataset = "data/DMDOD-v140-tuf-p11-p20"
checkpoint = "checkpoints/real_chart_humanvisible_school8h.pt"
output = "checkpoints/UNUSED_beta_training_ablation_DO_NOT_WRITE.pt"
device = "cuda"

[data]
anchor_limit = 20
validation_limit = 20
chunk_steps = 192

[human_visible]
updates_per_trial = 32
lr = 0.00005
min_lr = 0.000001
controller_lr = 0.00003
updates_per_epoch = 2
transition_updates_per_epoch = 1
transition_epochs = 3
burn_in_steps = 96
supervised_steps = 192
anchors_per_batch = 4
progression_streak = 3
catastrophic_patience = 2
max_epochs = 1
weight_decay = 0.0001
grad_clip = 1.0
seed = 2401
alpha_sweep_enabled = false

[budget]
hours = 2.0
reserve_minutes = 1.0
max_trials = 10000
reject_shrink = 0.5
safe_grow = 1.25
max_nonbest_accepts = 3
