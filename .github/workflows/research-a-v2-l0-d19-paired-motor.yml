name: Research A v2-L0-D19 paired physical Motor evaluation

on:
  pull_request:
    branches:
      - research/a-v2-l0-d18-frozen-policy-probability
    paths:
      - "docs/research-a-v2-l0-d19-*.md"
      - "scripts/a002v2_l0_d19_paired_motor.py"
      - "tests/test_research_a_v2_l0_d19_paired_motor.py"
      - ".github/workflows/research-a-v2-l0-d19-paired-motor.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  paired-physical-motor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout isolated D19 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Check D19 preregistered physical Motor contracts
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d19
          python -m pytest -q tests/test_research_a_v2_l0_d19_paired_motor.py 2>&1 | tee reports/research_a_v2_l0_d19/tests.log
      - name: Download D8 archived initial policy
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d8-cpu-dispatch
          path: archived-d8
          run-id: 41397065687
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download D12 archived first PPO update
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d12-frozen-ppo-cpu
          path: archived-d12
          run-id: 41424435292
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Evaluate same 45 A0 Motor cases before and after archived PPO update
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d19_paired_motor.py \
            --d8-dir archived-d8 --d12-dir archived-d12 \
            --out reports/research_a_v2_l0_d19/result.json \
            2>&1 | tee reports/research_a_v2_l0_d19/run.log
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d19-paired-physical-motor
          path: reports/research_a_v2_l0_d19/
          retention-days: 30
          if-no-files-found: warn
