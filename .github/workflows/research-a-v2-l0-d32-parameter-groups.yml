name: Research A v2-L0-D32 frozen step413 parameter group swap

on:
  pull_request:
    branches:
      - research/a-v2-l0-d31-a0-local-extra-expectation
    paths:
      - 'docs/research-a-v2-l0-d32-*.md'
      - 'scripts/a002v2_l0_d32_step413_parameter_group.py'
      - 'tests/test_research_a_v2_l0_d32_step413_parameter_group.py'
      - '.github/workflows/research-a-v2-l0-d32-parameter-groups.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-parameter-group-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout isolated D32 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify D32 group swap and invalid input controls
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d32
          python -m pytest -q tests/test_research_a_v2_l0_d32_step413_parameter_group.py \
            2>&1 | tee reports/research_a_v2_l0_d32/tests.log
      - name: Download archived D8 initial weights
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d8-cpu-dispatch
          path: archived-d8
          run-id: 41397065687
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download archived D12 initial batch and native updated weights
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d12-frozen-ppo-cpu
          path: archived-d12
          run-id: 41424435292
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download archived D28 fixed step413 observation and probabilities
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d28-step413-policy-reward
          path: archived-d28
          run-id: 41562899406
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Evaluate five preregistered hybrid policy conditions
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d32_step413_parameter_group.py \
            --d8-dir archived-d8 --d12-dir archived-d12 \
            --d28-result archived-d28/result.json \
            --out reports/research_a_v2_l0_d32/result.json \
            2>&1 | tee reports/research_a_v2_l0_d32/run.log
      - name: Preserve successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d32-parameter-group-swap
          path: reports/research_a_v2_l0_d32/
          retention-days: 30
          if-no-files-found: warn
