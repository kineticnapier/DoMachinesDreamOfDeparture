name: Research A v2-L0-D25 fixed-suffix Motor intervention

on:
  pull_request:
    branches:
      - research/a-v2-l0-d24-1ms-physical-replay
    paths:
      - "docs/research-a-v2-l0-d25-*.md"
      - "scripts/a002v2_l0_d25_frozen_suffix.py"
      - "tests/test_research_a_v2_l0_d25_frozen_suffix.py"
      - ".github/workflows/research-a-v2-l0-d25-frozen-suffix.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-suffix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout D25 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Motor and pytest without RL dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test D25 frozen-suffix replay
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d25
          python -m pytest -q tests/test_research_a_v2_l0_d25_frozen_suffix.py \
            2>&1 | tee reports/research_a_v2_l0_d25/tests.log
      - name: Download frozen D22 intervention traces
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d22-single-step-intervention
          path: archived-d22
          run-id: 41515190995
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Replay frozen-suffix and closed-loop commands
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d25_frozen_suffix.py \
            --d22-result archived-d22/result.json \
            --d22-traces archived-d22/steps.json \
            --out reports/research_a_v2_l0_d25/result.json \
            --window-out reports/research_a_v2_l0_d25/window.json \
            2>&1 | tee reports/research_a_v2_l0_d25/run.log
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d25-frozen-suffix
          path: reports/research_a_v2_l0_d25/
          retention-days: 30
          if-no-files-found: warn
