name: Research A v2-L0-D15 first PPO gradient clipping (frozen batch)

on:
  pull_request:
    branches:
      - research/a-v2-l0-d14-gradient-ulp-audit
    paths:
      - "docs/research-a-v2-l0-d15-first-ppo-clipping-*.md"
      - "scripts/a002v2_l0_d15_first_ppo_clipping.py"
      - "tests/test_research_a_v2_l0_d15_first_ppo_clipping.py"
      - ".github/workflows/research-a-v2-l0-d15-first-ppo-clipping.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  first-backward-clipping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout isolated D15 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify preregistered D15 invariants
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d15
          python -m pytest -q tests/test_research_a_v2_l0_d15_first_ppo_clipping.py 2>&1 | tee reports/research_a_v2_l0_d15/tests.log
      - name: Download archived D8 initial state
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d8-cpu-dispatch
          path: archived-d8
          run-id: 41397065687
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download archived D12 frozen batch and gradients
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d12-frozen-ppo-cpu
          path: archived-d12
          run-id: 41424435292
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Replay first backward on native CPU (no Adam step)
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d15_first_ppo_clipping.py \
            --mode condition --condition native \
            --d8-dir archived-d8 --d12-dir archived-d12 \
            --out reports/research_a_v2_l0_d15/native.json \
            2>&1 | tee reports/research_a_v2_l0_d15/native.log
      - name: Replay first backward on generic CPU (no Adam step)
        run: |
          set -o pipefail
          ATEN_CPU_CAPABILITY=default python -u scripts/a002v2_l0_d15_first_ppo_clipping.py \
            --mode condition --condition default \
            --d8-dir archived-d8 --d12-dir archived-d12 \
            --out reports/research_a_v2_l0_d15/default.json \
            2>&1 | tee reports/research_a_v2_l0_d15/default.log
      - name: Verify archived first gradient and classify clipping
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d15_first_ppo_clipping.py \
            --mode compare --d12-dir archived-d12 \
            --native reports/research_a_v2_l0_d15/native.json \
            --default reports/research_a_v2_l0_d15/default.json \
            --out reports/research_a_v2_l0_d15/comparison.json \
            2>&1 | tee reports/research_a_v2_l0_d15/comparison.log
      - name: Save successful and failed diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d15-first-ppo-clipping
          path: reports/research_a_v2_l0_d15/
          retention-days: 30
          if-no-files-found: warn
