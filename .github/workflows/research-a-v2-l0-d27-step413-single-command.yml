name: Research A v2-L0-D27 step413 single-command intervention

on:
  pull_request:
    branches:
      - research/a-v2-l0-d26-post362-suffix-swap
    paths:
      - "docs/research-a-v2-l0-d27-*.md"
      - "scripts/a002v2_l0_d27_step413_single_command.py"
      - "tests/test_research_a_v2_l0_d27_step413_single_command.py"
      - ".github/workflows/research-a-v2-l0-d27-step413-single-command.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  step413-intervention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout D27 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Motor and pytest without RL training
        run: python -m pip install -e ".[dev]"
      - name: Test D27 single-command boundaries
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d27
          python -m pytest -q tests/test_research_a_v2_l0_d27_step413_single_command.py \
            2>&1 | tee reports/research_a_v2_l0_d27/tests.log
      - name: Download frozen D22 intervention traces
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d22-single-step-intervention
          path: archived-d22
          run-id: 41515190995
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Replay D27 step413 single-command intervention
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d27_step413_single_command.py \
            --d22-result archived-d22/result.json \
            --d22-traces archived-d22/steps.json \
            --out reports/research_a_v2_l0_d27/result.json \
            2>&1 | tee reports/research_a_v2_l0_d27/run.log
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d27-step413-single-command
          path: reports/research_a_v2_l0_d27/
          retention-days: 30
          if-no-files-found: warn
