name: Research A v2-L0-D24 1ms physical Motor replay

on:
  pull_request:
    branches:
      - research/a-v2-l0-d23-archived-motor-threshold-trace
    paths:
      - "docs/research-a-v2-l0-d24-*.md"
      - "scripts/a002v2_l0_d24_1ms_physical_replay.py"
      - "tests/test_research_a_v2_l0_d24_1ms_physical_replay.py"
      - ".github/workflows/research-a-v2-l0-d24-1ms-physical-replay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  physical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout D24 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install local Motor and pytest without RL dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test D24 independent 1ms Motor replay
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d24
          python -m pytest -q tests/test_research_a_v2_l0_d24_1ms_physical_replay.py \
            2>&1 | tee reports/research_a_v2_l0_d24/tests.log
      - name: Download frozen D22 full-step traces
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d22-single-step-intervention
          path: archived-d22
          run-id: 41515190995
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Replay all archived physical commands at 1ms
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d24_1ms_physical_replay.py \
            --d22-result archived-d22/result.json \
            --d22-traces archived-d22/steps.json \
            --out reports/research_a_v2_l0_d24/result.json \
            --window-out reports/research_a_v2_l0_d24/window.json \
            2>&1 | tee reports/research_a_v2_l0_d24/run.log
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d24-1ms-physical-replay
          path: reports/research_a_v2_l0_d24/
          retention-days: 30
          if-no-files-found: warn
