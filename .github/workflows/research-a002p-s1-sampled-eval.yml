name: Research A002-P-S1 frozen-policy sampling evaluation (CPU)

on:
  pull_request:
    branches:
      - research/a002p-near-miss-reward-ablation
    paths:
      - "docs/research-a-experiment-002p-s1-sampled-eval-protocol.md"
      - "scripts/a002p_s1_sampled_evaluation.py"
      - "tests/test_research_a002p_s1_sampled_evaluation.py"
      - ".github/workflows/research-a002p-s1-sampled-eval.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare-original-frozen-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out isolated S1 branch
        uses: actions/checkout@v5
      - name: Set up CPU Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install original pinned CPU-only PyTorch
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Check fixed seed contract, physical scoring and replays
        run: python -m pytest -q tests/test_research_a002p_s1_sampled_evaluation.py
      - name: Retrieve original 8 final checkpoints, without retraining
        uses: actions/download-artifact@v4
        with:
          name: research-a002p-r1-paired-reward-comparison
          path: previous-paired
          run-id: 41300077879
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Compare argmax and categorical action sampling for every original model
        run: |
          mkdir -p reports/research_a002p_s1
          python -u scripts/a002p_s1_sampled_evaluation.py \
            --input previous-paired \
            --output reports/research_a002p_s1/all-model-evaluations.json \
            | tee reports/research_a002p_s1/summary.log
      - name: Keep all repeated episodes and summary, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a002p-s1-argmax-vs-sampled
          path: reports/research_a002p_s1/
          retention-days: 30
          if-no-files-found: warn
