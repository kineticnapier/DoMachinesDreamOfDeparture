name: Research A Experiment 001 periodic Motor pilot (CPU)

on:
  pull_request:
    branches:
      - develop/dmdogo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a001-exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out experimental research branch
        uses: actions/checkout@v5
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test fixed scan and scoring contracts
        run: python -m pytest -q tests/test_research_a001_periodic_motor_probe.py
      - name: Execute predeclared exploratory one-finger / two-finger sweep
        run: |
          mkdir -p reports
          python -u scripts/a001_periodic_motor_probe.py \
            --out reports/research-a001-periodic-motor-pilot.json \
            | tee reports/research-a001-periodic-motor-pilot-summary.json
      - name: Upload exploratory report (not a claim of physical limits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a001-periodic-motor-pilot
          path: reports/research-a001-periodic-motor-pilot*.json
          retention-days: 30
          if-no-files-found: warn
