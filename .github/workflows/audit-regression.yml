        run: |
          python -m pytest -q \
            tests/test_dmdogo_v09_h06_improved_suffix.py \
            tests/test_prestige1.py \
            tests/test_prestige1_actuator_teacher.py \
            tests/test_prestige1_timing_teacher.py \
