      # Ninth CPU batch: self-contained synthetic judgement, HUD, Motor,
      # DMDOGO policy and provenance tests. No historical Train dataset or live game.
      - name: Run further synthetic motor HUD and policy regression tests
        run: |
          python -m pytest -q \
            tests/test_audit_phase21_stock_visible_feedback_v01.py \
            tests/test_audit_stock_hold_h0_v01.py \
            tests/test_countdown_motor_preflight_v30.py \
            tests/test_countdown_phase_tracker_v01.py \
            tests/test_dmdogo_v09_h07_shadow_lane.py \
            tests/test_dmdogo_v09_h08_protected_quota.py \
