# Targeted regression checks for the consolidated audit branch.
# No training, live-game checks, GPU benchmarks, or checkpoint migration.
name: Audit regression (CPU)

on:
  pull_request:
    branches:
      - develop/dmdogo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit under test
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=2.0" "tqdm>=4.67"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run audit regression tests
        run: |
          python -m pytest -q \
            tests/test_adofai_rules.py \
            tests/test_training_config.py \
            tests/test_training_budget.py \
            tests/test_motor_env.py \
            tests/test_n_key_capacity.py \
            tests/test_simulator.py \
            tests/test_judgement_label_orders.py \
            tests/test_judgement_state_estimator_v01.py \
            tests/test_persistent_judgement_state_estimator_v02.py \
            tests/test_stock_persistent_judgement_state_estimator_v03.py \
            tests/test_rhythm_env.py \
            tests/test_real_chart_env.py \
            tests/test_dmdogo_h0_source_provenance.py

      # Broader regression coverage for already-committed fixes; no training or live ADOFAI.
      - name: Run expanded issue regression tests
        run: |
          python -m pytest -q \
            tests/test_stock_visible_judgement_feedback_v01.py \
            tests/test_stock_runtime_parity_v01.py \
            tests/test_stock_runtime_trace_v02.py \
            tests/test_stock_frame_state_machine.py \
            tests/test_stock_floor_state_machine.py \
            tests/test_fly_connectome_policy.py \
            tests/test_due_event_window_v06.py \
            tests/test_postrun_diagnostic_index_v06.py \
            tests/test_real_chart_resolution_cursor.py \
            tests/test_tuf_dataset.py \
            tests/test_tuf_dataset_preflight.py \
            tests/test_human_visible_curriculum.py \
            tests/test_persistent_fingering_scheduler_v01.py \
            tests/test_timing_evaluator.py \
            tests/test_perception.py \
            tests/test_adofai_chart.py

      # Existing CPU tests for judgement, HUD, motor, simulator and training.
      - name: Run further cross-domain regression tests
        run: |
          python -m pytest -q \
            tests/test_judgement_observer_v01.py \
            tests/test_stock_judgement_reference.py \
            tests/test_hold_judgement_v01.py \
            tests/test_motor_lead_feasibility_v01.py \
            tests/test_four_key_motor.py \
            tests/test_fast_n_key_motor.py \
            tests/test_pattern_scheduler_v06.py \
            tests/test_robust_scheduler_v01.py \
            tests/test_human_visible_policy.py \
            tests/test_training_action_trust.py \
            tests/test_training_progress.py \
            tests/test_training_trajectory_trust.py \
            tests/test_hud_bpm_unclipped.py \
            tests/test_stock_runtime_log_v01.py \
            tests/test_overload_trace.py \
            tests/test_adofai_hold_timing.py \
            tests/test_real_chart_hud.py \
            tests/test_real_chart_features.py \
            tests/test_timing_fingering_motor_integration_v02.py \
            tests/test_contact_timing_hud_v01.py \
            tests/test_hold_motor_overlay_v01.py \
            tests/test_motor_latency_v04.py

      # Existing CPU tests across visible timing, fingering, simulator and research provenance.
      - name: Run timing motor and reproducibility regression tests
        run: |
          python -m pytest -q \
            tests/test_hud_timing_tracker_v1.py \
            tests/test_hud_timing_tracker_fullturn_v13.py \
            tests/test_hud_timing_tracker_midspin_v16.py \
            tests/test_predictive_timing_observability_v01.py \
            tests/test_countdown_first_event_v01.py \
            tests/test_countdown_hud_v3.py \
            tests/test_fingering_candidate_scores.py \
            tests/test_fingering_reservation_v04.py \
            tests/test_motor_lead_compensation_v04.py \
            tests/test_state_aware_motor_latency_v01.py \
            tests/test_timing_fingering_contract_v02.py \
            tests/test_real_chart_v053.py \
            tests/test_real_chart_v070.py \
            tests/test_geometry_rhythm_env.py \
            tests/test_training_architecture.py \
            tests/test_training_real_chart.py \
            tests/test_curriculum.py \
            tests/test_random_connectome_policy.py \
            tests/test_predictive_recurrent_policy.py \
            tests/test_recurrent_policy_sequence.py \
            tests/test_dmdogo_v08_provenance_and_launcher.py \
            tests/test_dmdogo_v08_execution_audit.py \
            tests/test_phase31_stock_runtime_probe_source.py \
            tests/test_audit_hud_timing_phase10_source_identity.py

      # Fifth CPU batch: targeted HUD-only, Motor, Hold, training and reproducibility checks.
      # These tests do not run a training job or alter frozen experimental artifacts.
      - name: Run additional timing motor and training regression tests
        run: |
          python -m pytest -q \
            tests/test_audit_hud_timing_phase12_midspin_v01.py \
            tests/test_audit_phase16_event89_causal_v01.py \
            tests/test_audit_phase17_visible_judgement_v01.py \
            tests/test_audit_phase18_judgement_state_v01.py \
            tests/test_fast_motor.py \
            tests/test_four_key_policy.py \
            tests/test_hud_timing_tracker_lifecycle_v15.py \
            tests/test_hud_timing_tracker_checkpoint_v18.py \
            tests/test_hud_timing_tracker_transition_v14.py \
            tests/test_hud_timing_tracker_twirl_v17.py \
            tests/test_hud_v3_composite_forecast_source_v30.py \
            tests/test_hold_hud_v4.py \
            tests/test_hold_release_forecast_v01.py \
            tests/test_hold_release_motor_adapter_v01.py \
            tests/test_fingering_reservation_v05.py \
            tests/test_fingering_reservation_v06.py \
            tests/test_gesture_chunk_planner_v08.py \
            tests/test_n_key_policy_backend.py \
            tests/test_n_key_training.py \
            tests/test_real_chart_v054.py \
            tests/test_real_chart_v055.py \
            tests/test_real_chart_v056.py \
            tests/test_real_chart_v057.py \
            tests/test_real_chart_v058.py \
            tests/test_timing_countdown_v3.py

      # Sixth CPU batch: isolated HUD observability, Motor, simulator and policy tests.
      # Excludes live ADOFAI, historical checkpoint execution and GPU benchmarks.
      - name: Run further HUD Motor simulator and inference regression tests
        run: |
          python -m pytest -q \
            tests/test_audit_bool_second_event_counterfactual_v01.py \
            tests/test_audit_countdown_hud_v3_phase1.py \
            tests/test_audit_countdown_timing_phase2_v01.py \
            tests/test_audit_hud_timing_phase13_setspeed_v01.py \
            tests/test_hud_timing_tracker_current_speed_v12.py \
            tests/test_jrp_bpm_v1.py \
            tests/test_audit_n_key_bc_actions.py \
            tests/test_audit_n_key_set_actions.py \
            tests/test_fingering_reservation_v03.py \
            tests/test_pattern_motor_v06.py \
            tests/test_four_key_calibration.py \
            tests/test_four_key_real_chart.py \
            tests/test_real_chart_v059.py \
            tests/test_real_chart_v060.py \
            tests/test_recurrent_policy.py \
            tests/test_visual_observation.py \
            tests/test_visual_policy.py \
            tests/test_pattern_memory.py \
            tests/test_malecns_connectome.py \
            tests/test_dmdogo_v09_h01_conditions.py \
            tests/test_dmdogo_v09_h02_boundary_cf.py \
            tests/test_dmdogo_v09_h03_boundary_controls.py \
            tests/test_motion_geometry_env.py \
            tests/test_recovery_probe.py \
            tests/test_planet_perception.py
