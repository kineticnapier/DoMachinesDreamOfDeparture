            tests/test_prestige1_autoplay_visible_prefix_audit.py \
            tests/test_prestige1_autoplay_coupled_chart_audit.py \
            tests/test_prestige1_autoplay_coupled_contact_audit.py \
            tests/test_prestige1_autoplay_coupled_contact_sequences_audit.py \
            tests/test_prestige1_autoplay_coupled_chart_patterns_audit.py \
            tests/test_prestige1_autoplay_halfturn_countdown_audit.py \
            tests/test_prestige1_autoplay_8k16k_motor_capacity_audit.py \
            tests/test_prestige1_autoplay_persistent_motor_audit.py \
