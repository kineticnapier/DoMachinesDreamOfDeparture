            tests/test_phase31_stock_runtime_probe_source.py \
            tests/test_audit_hud_timing_phase10_source_identity.py

      # Fifth CPU batch: targeted HUD-only, Motor, Hold, training and reproducibility checks.
      # These tests do not run a training job or alter frozen experimental artifacts.
      - name: Run additional timing motor and training regression tests
        run: |
          python -m pytest -q \
            tests/test_audit_hud_timing_phase12_midspin_v01.py \
            tests/test_audit_phase16_event89_causal_v01.py \
            tests/test_audit_phase17_visible_judgement_v01.py \
            tests/test_audit_phase18_judgement_state_v01.py \
            tests/test_fast_motor.py \
            tests/test_four_key_policy.py \
            tests/test_hud_timing_tracker_lifecycle_v15.py \
            tests/test_hud_timing_tracker_checkpoint_v18.py \
            tests/test_hud_timing_tracker_transition_v14.py \
            tests/test_hud_timing_tracker_twirl_v17.py \
            tests/test_hud_v3_composite_forecast_source_v30.py \
            tests/test_hold_hud_v4.py \
            tests/test_hold_release_forecast_v01.py \
            tests/test_hold_release_motor_adapter_v01.py \
            tests/test_fingering_reservation_v05.py \
            tests/test_fingering_reservation_v06.py \
            tests/test_gesture_chunk_planner_v08.py \
            tests/test_n_key_policy_backend.py \
            tests/test_n_key_training.py \
            tests/test_real_chart_v054.py \
            tests/test_real_chart_v055.py \
            tests/test_real_chart_v056.py \
            tests/test_real_chart_v057.py \
            tests/test_real_chart_v058.py \
            tests/test_timing_countdown_v3.py

      # Sixth CPU batch: isolated HUD observability, Motor, simulator and policy tests.
      # Excludes live ADOFAI, historical checkpoint execution and GPU benchmarks.
      - name: Run further HUD Motor simulator and inference regression tests
        run: |
          python -m pytest -q \
            tests/test_audit_bool_second_event_counterfactual_v01.py \
            tests/test_audit_countdown_hud_v3_phase1.py \
            tests/test_audit_countdown_timing_phase2_v01.py \
            tests/test_real_chart_v061.py \
            tests/test_hud_timing_tracker_current_speed_v12.py \
            tests/test_jrp_bpm_v1.py \
            tests/test_audit_n_key_bc_actions.py \
            tests/test_audit_n_key_set_actions.py \
            tests/test_fingering_reservation_v03.py \
            tests/test_pattern_motor_v06.py \
            tests/test_four_key_calibration.py \
            tests/test_four_key_real_chart.py \
            tests/test_real_chart_v059.py \
            tests/test_real_chart_v060.py \
            tests/test_recurrent_policy.py \
            tests/test_visual_observation.py \
            tests/test_visual_policy.py \
            tests/test_pattern_memory.py \
            tests/test_malecns_connectome.py \
            tests/test_dmdogo_v09_h01_conditions.py \
            tests/test_dmdogo_v09_h02_boundary_cf.py \
            tests/test_dmdogo_v09_h03_boundary_controls.py \
            tests/test_motion_geometry_env.py \
            tests/test_recovery_probe.py \
            tests/test_planet_perception.py

      # Seventh CPU batch: self-contained synthetic Hold, HUD, Motor, simulator and policy tests.
      # Historical Train charts, live game and checkpoint replay are intentionally excluded.
      - name: Run synthetic Hold HUD Motor and policy regression tests
        run: |
          python -m pytest -q \
            tests/test_audit_hold_h7_mesh_v01.py \
            tests/test_audit_hold_h9_end_to_end_v01.py \
            tests/test_hold_mesh_observability_v01.py \
            tests/test_hud_timing_tracker_partial_v11.py \
            tests/test_jrp_cbpm_anchor_v1.py \
            tests/test_jrp_cbpm_anchor_v2.py \
            tests/test_jrp_cbpm_anchor_v3.py \
            tests/test_real_chart_v062.py \
            tests/test_real_chart_v063.py \
            tests/test_real_chart_v064.py \
            tests/test_real_chart_v065.py \
            tests/test_real_chart_hud_features.py \
            tests/test_prestige1_causal_planning_contract.py \
            tests/test_prestige1_target_contract.py \
            tests/test_prestige1_failure_diagnostics.py \
            tests/test_prestige1_finger_phase.py \
            tests/test_prestige1_autoplay_countdown.py \
            tests/test_prestige1_autoplay_first_frame_geometry_audit.py \
            tests/test_prestige1_autoplay_future_events_audit.py \
            tests/test_prestige1_autoplay_halfturn_audit.py \
            tests/test_prestige1_autoplay_motor_schedule_audit.py \
            tests/test_prestige1_autoplay_high_bpm_simulator_audit.py \
            tests/test_prestige1_autoplay_near_countdown_audit.py \
            tests/test_prestige1_autoplay_contact_judgement_audit.py \
            tests/test_prestige1_autoplay_switch_hud_audit.py

      # Eighth CPU batch: Prestige I synthetic timing/motor/inference and
      # DMDOGO policy contract tests. No frozen Train charts, live ADOFAI or GPU.
