name: Research A v2-L0-D2 frozen onset advantage audit (CPU)

on:
  pull_request:
    branches:
      - research/a-v2-l0-r2-penalty
    paths:
      - "docs/research-a-v2-l0-d2-onset-advantage-protocol.md"
      - "scripts/a002v2_l0_d2_onset_advantage.py"
      - "tests/test_research_a_v2_l0_d2_onset_advantage.py"
      - ".github/workflows/research-a-v2-l0-d2-onset-advantage.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-policy-advantage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout isolated D2 branch
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify replay and no-training contracts
        run: |
          python -m pytest -q tests/test_research_a_v2_l0_d2_onset_advantage.py
      - name: Download unchanged R1 archived policies
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-low-speed-learning
          path: original-r1
          run-id: 41309837474
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download unchanged R2 archived policies
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-r2-penalty-comparison
          path: original-r2
          run-id: 41312136897
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Replay all 288 held-out sampled episodes without training
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d2
          python -u scripts/a002v2_l0_d2_onset_advantage.py \
            --r1 original-r1 --r2 original-r2 \
            --out reports/research_a_v2_l0_d2/full-diagnostic.json \
            | tee reports/research_a_v2_l0_d2/summary.log
      - name: Preserve all positive and negative D2 outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d2-frozen-onset-advantage
          path: reports/research_a_v2_l0_d2/
          retention-days: 30
          if-no-files-found: warn
