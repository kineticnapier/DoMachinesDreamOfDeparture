name: Research A001 startup transient diagnosis (CPU)

on:
  pull_request:
    branches:
      - develop/dmdogo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a001-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q tests/test_research_a001_startup_diagnostic.py
      - name: Repeat frozen v1 configurations and locate missed ordinals
        run: |
          mkdir -p reports
          python -u scripts/a001_startup_diagnostic.py \
            --out reports/research-a001-startup-diagnostic.json \
            | tee reports/research-a001-startup-diagnostic-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-a001-startup-diagnostic
          path: reports/research-a001-startup-diagnostic*.json
          retention-days: 30
          if-no-files-found: warn
