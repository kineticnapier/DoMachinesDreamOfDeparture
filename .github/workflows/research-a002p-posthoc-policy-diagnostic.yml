name: Research A002-P saved-policy posthoc diagnosis (CPU)

on:
  pull_request:
    branches:
      - develop/dmdogo
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-original-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout diagnostic without altering original pilot
        uses: actions/checkout@v5
      - name: Set up Python 3.11 CPU
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify physical trace instrumentation and model SHA checks
        run: python -m pytest -q tests/test_research_a002p_posthoc_policy_diagnostic.py
      - name: Retrieve original A002-P result artifact from run 41296142433
        uses: actions/download-artifact@v4
        with:
          name: research-a002p-pilot-unapproved
          path: previous-pilot
          run-id: 41296142433
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Replay original four checkpoints without training
        run: |
          mkdir -p reports/research_a002p_diagnosis
          python -u scripts/a002p_posthoc_policy_diagnostic.py \
            --input-dir previous-pilot \
            --output reports/research_a002p_diagnosis/original-policy-posthoc.json \
            | tee reports/research_a002p_diagnosis/summary.log
      - name: Preserve complete timing/physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a002p-original-policy-posthoc
          path: reports/research_a002p_diagnosis/
          retention-days: 30
          if-no-files-found: warn
