name: Research A v2-L0-R2 negative-extra penalty comparison (CPU)

on:
  pull_request:
    branches:
      - research/a-v2-l0-credit-diagnostic
    paths:
      - "docs/research-a-v2-l0-r2-penalty-protocol.md"
      - "scripts/a002v2_l0_r2_penalty_env.py"
      - "scripts/a002v2_l0_r2_penalty_compare.py"
      - "tests/test_research_a_v2_l0_r2_penalty.py"
      - ".github/workflows/research-a-v2-l0-r2-penalty.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay-r1-and-train-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out isolated R2 branch
        uses: actions/checkout@v5
      - name: Set up original CPU Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install original pinned CPU PyTorch
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Test R1/R2 identical physical state and exact minus 0.05 on near Extras
        run: |
          python -m pytest -q tests/test_research_a_v2_l0_r2_penalty.py
      - name: Retrieve untouched R1 original checkpoints and all histories
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-low-speed-learning
          path: original-l0
          run-id: 41309837474
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Verify R1 source and train four from-scratch R2 models
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_r2/checkpoints
          python -u scripts/a002v2_l0_r2_penalty_compare.py \
            --original original-l0 \
            --out reports/research_a_v2_l0_r2/full-comparison.json \
            --checkpoints reports/research_a_v2_l0_r2/checkpoints \
            | tee reports/research_a_v2_l0_r2/summary.log
      - name: Preserve every R2 checkpoint and all success/failure observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-r2-penalty-comparison
          path: reports/research_a_v2_l0_r2/
          retention-days: 30
          if-no-files-found: warn
