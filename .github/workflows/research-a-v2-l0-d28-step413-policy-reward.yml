name: Research A v2-L0-D28 step413 archived policy and reward audit

on:
  pull_request:
    branches:
      - research/a-v2-l0-d27-step413-single-command
    paths:
      - 'docs/research-a-v2-l0-d28-*.md'
      - 'scripts/a002v2_l0_d28_step413_policy_reward.py'
      - 'tests/test_research_a_v2_l0_d28_step413_policy_reward.py'
      - '.github/workflows/research-a-v2-l0-d28-step413-policy-reward.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  archived-policy-reward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout D28 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package and pytest (no training)
        run: python -m pip install -e '.[dev]'
      - name: Test D28 integrity and negative controls
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d28
          python -m pytest -q tests/test_research_a_v2_l0_d28_step413_policy_reward.py \
            2>&1 | tee reports/research_a_v2_l0_d28/tests.log
      - name: Download frozen D22 source
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d22-single-step-intervention
          path: archived-d22
          run-id: 41515190995
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Audit archived step413 policy and reward
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d28_step413_policy_reward.py \
            --d22-result archived-d22/result.json \
            --d22-traces archived-d22/steps.json \
            --out reports/research_a_v2_l0_d28/result.json \
            2>&1 | tee reports/research_a_v2_l0_d28/run.log
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d28-step413-policy-reward
          path: reports/research_a_v2_l0_d28/
          retention-days: 30
          if-no-files-found: warn
