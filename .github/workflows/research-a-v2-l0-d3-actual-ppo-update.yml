name: Research A v2-L0-D3 exact PPO training update audit (CPU)

on:
  pull_request:
    branches:
      - research/a-v2-l0-d2-onset-advantage
    paths:
      - "docs/research-a-v2-l0-d3-actual-ppo-update-protocol.md"
      - "scripts/a002v2_l0_d3_actual_ppo_update.py"
      - "tests/test_research_a_v2_l0_d3_actual_ppo_update.py"
      - ".github/workflows/research-a-v2-l0-d3-actual-ppo-update.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay-original-training:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout isolated D3 branch
        uses: actions/checkout@v5
      - name: Set up original CPU Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install original CPU dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original PPO updates and physical traces are unchanged
        run: |
          python -m pytest -q tests/test_research_a_v2_l0_d3_actual_ppo_update.py
      - name: Download untouched original R1 checkpoint and training histories
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-low-speed-learning
          path: original-r1
          run-id: 41309837474
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download untouched original R2 checkpoint and training histories
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-r2-penalty-comparison
          path: original-r2
          run-id: 41312136897
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Reproduce all original 8 models and record real PPO gradients
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d3
          python -u scripts/a002v2_l0_d3_actual_ppo_update.py \
            --r1 original-r1 \
            --r2 original-r2 \
            --output-dir reports/research_a_v2_l0_d3 \
            | tee reports/research_a_v2_l0_d3/summary.log
      - name: Preserve full results including reproduction failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d3-actual-ppo-update
          path: reports/research_a_v2_l0_d3/
          retention-days: 30
          if-no-files-found: warn
