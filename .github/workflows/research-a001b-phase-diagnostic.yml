name: Research A001b post-hoc phase diagnosis (CPU)

on:
  pull_request:
    branches:
      - develop/dmdogo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Check phase diagnostic contracts
        run: python -m pytest -q tests/test_research_a001b_phase_diagnostic.py
      - name: Compare physical KeyDown offsets at fixed v1 scenarios
        run: |
          mkdir -p reports
          python -u scripts/a001b_posthoc_phase_diagnostic.py \
            --out reports/research-a001b-posthoc-phase.json \
            | tee reports/research-a001b-posthoc-phase-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-a001b-posthoc-phase
          path: reports/research-a001b-posthoc-phase*.json
          retention-days: 30
          if-no-files-found: warn
