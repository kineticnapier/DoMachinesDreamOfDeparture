name: Research A v2-L0-D7 locate first R1 PPO divergence (max 128 episodes)

on:
  pull_request:
    branches:
      - research/a-v2-l0-d6-r1-repeatability-audit
    paths:
      - "docs/research-a-v2-l0-d7-first-ppo-divergence-protocol.md"
      - "scripts/a002v2_l0_d7_first_ppo_divergence.py"
      - "tests/test_research_a_v2_l0_d7_first_ppo_divergence.py"
      - ".github/workflows/research-a-v2-l0-d7-first-ppo-divergence.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  first-update-divergence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout D7 Draft branch
        uses: actions/checkout@v5
      - name: Set up original Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Run ten D7 unit checks before any training
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d7
          python -m pytest -q tests/test_research_a_v2_l0_d7_first_ppo_divergence.py 2>&1 | tee reports/research_a_v2_l0_d7/tests.log
      - name: Download original R1 history and weights
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-low-speed-learning
          path: original-r1
          run-id: 41309837474
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download original R2 archive for D5-equivalent setup
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-r2-penalty-comparison
          path: original-r2
          run-id: 41312136897
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download D3 exact R1 update and physical event traces
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d3-actual-ppo-update
          path: original-d3
          run-id: 41369778494
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Compare first 16 R1 updates and stop at first exact difference
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d7_first_ppo_divergence.py \
            --r1 original-r1 --r2 original-r2 \
            --d3 original-d3/full-diagnostic.json \
            --out reports/research_a_v2_l0_d7/result.json \
            2>&1 | tee reports/research_a_v2_l0_d7/experiment.log
      - name: Preserve positive and negative outcomes and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d7-first-ppo-divergence
          path: reports/research_a_v2_l0_d7/
          retention-days: 30
          if-no-files-found: warn
