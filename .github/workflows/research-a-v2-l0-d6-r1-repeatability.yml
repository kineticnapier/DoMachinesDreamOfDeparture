name: Research A v2-L0-D6 archived R1 repeatability audit (no training)

on:
  pull_request:
    branches:
      - research/a-v2-l0-d5-r1-prefix-order
    paths:
      - "docs/research-a-v2-l0-d6-r1-repeatability-protocol.md"
      - "scripts/a002v2_l0_d6_r1_repeatability.py"
      - "tests/test_research_a_v2_l0_d6_r1_repeatability.py"
      - ".github/workflows/research-a-v2-l0-d6-r1-repeatability.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  archived-repeatability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout isolated D6 Draft branch
        uses: actions/checkout@v5
      - name: Set up original Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies (no training)
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Run seven D6 unit checks
        run: python -m pytest -q tests/test_research_a_v2_l0_d6_r1_repeatability.py
      - name: Download original R1 artifact
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-low-speed-learning
          path: original-r1
          run-id: 41309837474
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download D3 artifact (R1 exact, R2 failed)
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d3-actual-ppo-update
          path: original-d3
          run-id: 41369778494
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download first D5 artifact
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d5-r1-prefix-order
          path: original-d5a
          run-id: 41380105087
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download second D5 artifact
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d5-r1-prefix-order
          path: original-d5b
          run-id: 41380334940
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Compare archived outputs without any training
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d6
          python -u scripts/a002v2_l0_d6_r1_repeatability.py \
            --r1 original-r1 --d3 original-d3 \
            --d5a original-d5a --d5b original-d5b \
            --out reports/research_a_v2_l0_d6/full-audit.json \
            | tee reports/research_a_v2_l0_d6/audit.log
      - name: Preserve results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d6-r1-repeatability
          path: reports/research_a_v2_l0_d6/
          retention-days: 30
          if-no-files-found: warn
