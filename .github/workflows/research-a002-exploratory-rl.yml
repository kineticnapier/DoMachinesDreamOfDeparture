name: Research A002-P from-scratch RL pilot (CPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-free-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out isolated research A002-P branch
        uses: actions/checkout@v5
      - name: Configure CPU Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies and CPU-only PyTorch
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Guard no-teacher reward and run PPO smoke
        run: python -m pytest -q tests/test_research_a002_exploratory.py
      - name: Train A0 and A1 from scratch (2 seeds each) without teacher
        run: |
          mkdir -p artifacts/research_a002/checkpoints
          python -u scripts/a002_exploratory_ppo.py \
            --out artifacts/research_a002/pilot.json \
            --checkpoints artifacts/research_a002/checkpoints \
            | tee artifacts/research_a002/pilot-output.log
      - name: Archive all negative/positive results and every final policy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a002p-pilot-unapproved
          path: artifacts/research_a002/
          retention-days: 30
          if-no-files-found: warn
