name: Research A002-P-R1 paired reward ablation (CPU)

on:
  pull_request:
    branches:
      - research/a002-exploratory-rl
    paths:
      - "docs/research-a-experiment-002p-r1-reward-ablation-protocol.md"
      - "scripts/a002p_reward_ablation_train.py"
      - "scripts/a002_exploratory_ppo.py"
      - "scripts/a002p_posthoc_policy_diagnostic.py"
      - "src/dmdod/research/a002p_reward_ablation.py"
      - "tests/test_research_a002p_reward_ablation.py"
      - ".github/workflows/research-a002p-r1-reward-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  paired-r0-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out isolated A002-P-R1 Draft
        uses: actions/checkout@v5
      - name: CPU Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install same pinned PyTorch as original pilot
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify reward-only delta, PPO injection, physics and original-control contract
        run: |
          python -m pytest -q \
            tests/test_research_a002p_reward_ablation.py \
            tests/test_research_a002_exploratory.py
      - name: Download original saved 002-P pilot for R0 replay comparison
        uses: actions/download-artifact@v4
        with:
          name: research-a002p-pilot-unapproved
          path: previous-pilot
          run-id: 41296142433
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Train R0/R1 by A0/A1 and two seeds, preserve all outcomes
        run: |
          mkdir -p reports/research_a002p_r1/checkpoints
          python -u scripts/a002p_reward_ablation_train.py \
            --original previous-pilot \
            --output reports/research_a002p_r1/paired-results.json \
            --checkpoints reports/research_a002p_r1/checkpoints \
            | tee reports/research_a002p_r1/full-output.log
      - name: Archive full results and all eight trained models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a002p-r1-paired-reward-comparison
          path: reports/research_a002p_r1/
          retention-days: 30
          if-no-files-found: warn
