name: Research A v2-L0-D11 dynamic evaluation CPU stages (no training)

on:
  pull_request:
    branches:
      - research/a-v2-l0-d10-fixed-forward-stage
    paths:
      - "docs/research-a-v2-l0-d11-dynamic-forward-protocol.md"
      - "scripts/a002v2_l0_d11_dynamic_forward.py"
      - "tests/test_research_a_v2_l0_d11_dynamic_forward.py"
      - ".github/workflows/research-a-v2-l0-d11-dynamic-forward.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dynamic-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout isolated D11 Draft branch
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Run D11 contract tests
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d11
          python -m pytest -q tests/test_research_a_v2_l0_d11_dynamic_forward.py 2>&1 | tee reports/research_a_v2_l0_d11/tests.log
      - name: Download frozen D8 initial weights and evidence
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d8-cpu-dispatch
          path: archived-d8
          run-id: 41397065687
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Capture D8 actual dynamic observations on native CPU
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d11_dynamic_forward.py \
            --mode capture \
            --weights archived-d8/native-initial-state.pt \
            --d8-native archived-d8/native.json --d8-default archived-d8/default.json \
            --out reports/research_a_v2_l0_d11/capture.json \
            2>&1 | tee reports/research_a_v2_l0_d11/capture.log
      - name: Replay frozen observations through native CPU forward
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d11_dynamic_forward.py \
            --mode forward --condition native \
            --weights archived-d8/native-initial-state.pt \
            --capture reports/research_a_v2_l0_d11/capture.json \
            --d8-native archived-d8/native.json --d8-default archived-d8/default.json \
            --out reports/research_a_v2_l0_d11/native.json \
            2>&1 | tee reports/research_a_v2_l0_d11/native.log
      - name: Replay identical frozen observations through generic CPU forward
        run: |
          set -o pipefail
          ATEN_CPU_CAPABILITY=default python -u scripts/a002v2_l0_d11_dynamic_forward.py \
            --mode forward --condition default \
            --weights archived-d8/native-initial-state.pt \
            --capture reports/research_a_v2_l0_d11/capture.json \
            --d8-native archived-d8/native.json --d8-default archived-d8/default.json \
            --out reports/research_a_v2_l0_d11/default.json \
            2>&1 | tee reports/research_a_v2_l0_d11/default.log
      - name: Compare D8 entropy and first bit-exact dynamic stage
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d11_dynamic_forward.py \
            --mode compare \
            --capture reports/research_a_v2_l0_d11/capture.json \
            --native reports/research_a_v2_l0_d11/native.json \
            --default reports/research_a_v2_l0_d11/default.json \
            --d8-native archived-d8/native.json --d8-default archived-d8/default.json \
            --out reports/research_a_v2_l0_d11/comparison.json \
            2>&1 | tee reports/research_a_v2_l0_d11/comparison.log
      - name: Preserve positive and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d11-dynamic-forward
          path: reports/research_a_v2_l0_d11/
          retention-days: 30
          if-no-files-found: warn
