name: Research A v2-L0-D16 frozen first-batch action signals

on:
  pull_request:
    branches:
      - research/a-v2-l0-d15-first-ppo-gradient-clipping
    paths:
      - "docs/research-a-v2-l0-d16-first-batch-action-signal-*.md"
      - "scripts/a002v2_l0_d16_first_batch_action_signal.py"
      - "tests/test_research_a_v2_l0_d16_first_batch_action_signal.py"
      - ".github/workflows/research-a-v2-l0-d16-action-signal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  first-batch-action-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout isolated D16 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify preregistered D16 invariants
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d16
          python -m pytest -q tests/test_research_a_v2_l0_d16_first_batch_action_signal.py 2>&1 | tee reports/research_a_v2_l0_d16/tests.log
      - name: Download archived D8 initial state
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d8-cpu-dispatch
          path: archived-d8
          run-id: 41397065687
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download archived D12 frozen PPO batch and physical records
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d12-frozen-ppo-cpu
          path: archived-d12
          run-id: 41424435292
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Analyze action-specific first-batch PPO terms without updates
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d16_first_batch_action_signal.py \
            --d8-dir archived-d8 --d12-dir archived-d12 \
            --out reports/research_a_v2_l0_d16/result.json \
            2>&1 | tee reports/research_a_v2_l0_d16/run.log
      - name: Save success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d16-first-batch-action-signals
          path: reports/research_a_v2_l0_d16/
          retention-days: 30
          if-no-files-found: warn
