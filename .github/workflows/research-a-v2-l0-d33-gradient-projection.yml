name: Research A v2-L0-D33 frozen step413 PPO gradient projection

on:
  pull_request:
    branches:
      - research/a-v2-l0-d32-step413-parameter-group-swap
    paths:
      - 'docs/research-a-v2-l0-d33-*.md'
      - 'scripts/a002v2_l0_d33_step413_gradient_projection.py'
      - 'tests/test_research_a_v2_l0_d33_step413_gradient_projection.py'
      - '.github/workflows/research-a-v2-l0-d33-gradient-projection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-step413-gradient-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout isolated D33 Draft branch
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Test preregistered directional projections and invalid inputs
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d33
          python -m pytest -q tests/test_research_a_v2_l0_d33_step413_gradient_projection.py \
            2>&1 | tee reports/research_a_v2_l0_d33/tests.log
      - name: Download D8 initial state
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d8-cpu-dispatch
          path: archived-d8
          run-id: 41397065687
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download D12 frozen PPO batch
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d12-frozen-ppo-cpu
          path: archived-d12
          run-id: 41424435292
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download D17 frozen first PPO action gradients
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d17-action-gradients
          path: archived-d17
          run-id: 41472753103
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download D28 fixed step413 observation and probabilities
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d28-step413-policy-reward
          path: archived-d28
          run-id: 41562899406
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Compute eight frozen autograd directions without training
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d33_step413_gradient_projection.py \
            --d8-dir archived-d8 --d12-dir archived-d12 \
            --d17-result archived-d17/result.json \
            --d28-result archived-d28/result.json \
            --out reports/research_a_v2_l0_d33/result.json \
            2>&1 | tee reports/research_a_v2_l0_d33/run.log
      - name: Preserve success and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d33-gradient-projection
          path: reports/research_a_v2_l0_d33/
          retention-days: 30
          if-no-files-found: warn
