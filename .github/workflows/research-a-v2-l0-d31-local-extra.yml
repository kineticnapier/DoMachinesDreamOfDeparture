name: Research A v2-L0-D31 local A0 KeyDown expectation

on:
  pull_request:
    branches:
      - research/a-v2-l0-d30-common-rng-seed-sensitivity
    paths:
      - 'docs/research-a-v2-l0-d31-*.md'
      - 'scripts/a002v2_l0_d31_local_extra_expectation.py'
      - 'tests/test_research_a_v2_l0_d31_local_extra_expectation.py'
      - '.github/workflows/research-a-v2-l0-d31-local-extra.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  local-extra-expectation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated D31 Draft
        uses: actions/checkout@v5
      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test archived evidence and invalid inputs
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d31
          python -m pytest -q tests/test_research_a_v2_l0_d31_local_extra_expectation.py \
            2>&1 | tee reports/research_a_v2_l0_d31/tests.log
      - name: Download D27 archived physical intervention
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d27-step413-single-command
          path: archived-d27
          run-id: 41556553776
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download D30 archived policy probabilities
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d30-common-rng-seed-sensitivity
          path: archived-d30
          run-id: 41574924385
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Compute preregistered local conditional expectation
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d31_local_extra_expectation.py \
            --d27-result archived-d27/result.json \
            --d30-result archived-d30/result.json \
            --out reports/research_a_v2_l0_d31/result.json \
            2>&1 | tee reports/research_a_v2_l0_d31/run.log
      - name: Preserve successful and failed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d31-local-extra-expectation
          path: reports/research_a_v2_l0_d31/
          retention-days: 30
          if-no-files-found: warn
