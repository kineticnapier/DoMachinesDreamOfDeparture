name: Research A v2-L0-D12 frozen PPO CPU update (one batch)

on:
  pull_request:
    branches:
      - research/a-v2-l0-d11-dynamic-eval-forward
    paths:
      - "docs/research-a-v2-l0-d12-frozen-ppo-cpu-protocol.md"
      - "docs/research-a-v2-l0-d12-frozen-ppo-cpu-results.md"
      - "scripts/a002v2_l0_d12_frozen_ppo_cpu.py"
      - "tests/test_research_a_v2_l0_d12_frozen_ppo_cpu.py"
      - ".github/workflows/research-a-v2-l0-d12-frozen-ppo-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-ppo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout isolated D12 Draft branch
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Test preregistered D12 contracts
        run: |
          set -o pipefail
          mkdir -p reports/research_a_v2_l0_d12
          python -m pytest -q tests/test_research_a_v2_l0_d12_frozen_ppo_cpu.py 2>&1 | tee reports/research_a_v2_l0_d12/tests.log
      - name: Download original D8 frozen initial weights
        uses: actions/download-artifact@v4
        with:
          name: research-a-v2-l0-d8-cpu-dispatch
          path: archived-d8
          run-id: 41397065687
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Capture only first eight A0 physical training episodes
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d12_frozen_ppo_cpu.py \
            --mode capture --weights archived-d8/native-initial-state.pt \
            --d8-native archived-d8/native.json --d8-default archived-d8/default.json \
            --batch reports/research_a_v2_l0_d12/frozen-batch.pt \
            --out reports/research_a_v2_l0_d12/capture.json \
            2>&1 | tee reports/research_a_v2_l0_d12/capture.log
      - name: Original PPO update on native CPU using frozen batch
        run: |
          set -o pipefail
          env -u ATEN_CPU_CAPABILITY python -u scripts/a002v2_l0_d12_frozen_ppo_cpu.py \
            --mode update --condition native \
            --weights archived-d8/native-initial-state.pt \
            --d8-native archived-d8/native.json --d8-default archived-d8/default.json \
            --batch reports/research_a_v2_l0_d12/frozen-batch.pt \
            --capture reports/research_a_v2_l0_d12/capture.json \
            --out reports/research_a_v2_l0_d12/native.json \
            2>&1 | tee reports/research_a_v2_l0_d12/native.log
      - name: Original PPO update on generic CPU using identical batch
        run: |
          set -o pipefail
          ATEN_CPU_CAPABILITY=default python -u scripts/a002v2_l0_d12_frozen_ppo_cpu.py \
            --mode update --condition default \
            --weights archived-d8/native-initial-state.pt \
            --d8-native archived-d8/native.json --d8-default archived-d8/default.json \
            --batch reports/research_a_v2_l0_d12/frozen-batch.pt \
            --capture reports/research_a_v2_l0_d12/capture.json \
            --out reports/research_a_v2_l0_d12/default.json \
            2>&1 | tee reports/research_a_v2_l0_d12/default.log
      - name: Compare all gradients, weights, Adam states and PPO losses
        run: |
          set -o pipefail
          python -u scripts/a002v2_l0_d12_frozen_ppo_cpu.py \
            --mode compare \
            --capture reports/research_a_v2_l0_d12/capture.json \
            --native reports/research_a_v2_l0_d12/native.json \
            --default reports/research_a_v2_l0_d12/default.json \
            --out reports/research_a_v2_l0_d12/comparison.json \
            2>&1 | tee reports/research_a_v2_l0_d12/comparison.log
      - name: Preserve positive, negative and partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-a-v2-l0-d12-frozen-ppo-cpu
          path: reports/research_a_v2_l0_d12/
          retention-days: 30
          if-no-files-found: warn
