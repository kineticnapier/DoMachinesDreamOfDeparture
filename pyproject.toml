[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "do-machines-dream-of-departure"
version = "0.1.0"
description = "Human-constrained reinforcement-learning experiments for ADOFAI"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]
rl = [
    "numpy>=2.0",
    "torch>=2.3",
    "tqdm>=4.67",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dmdod"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Sparse CSR tensor support is in beta state.*:UserWarning",
    "ignore:Sparse invariant checks are implicitly disabled.*:UserWarning",
]
